<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Прототип: SQLite-Wasm + OPFS для StackEdit</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #16181d; background: #f6f7f9;
  }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  p.lead { margin: 0 0 20px; color: #5b6270; max-width: 70ch; }
  .grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  section { background: #fff; border: 1px solid #e2e5ea; border-radius: 10px; padding: 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: #6b7280; margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  button {
    font: inherit; padding: 7px 12px; border-radius: 7px; border: 1px solid #cfd4dc;
    background: #fbfbfc; color: #16181d; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #f1f3f6; }
  button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  button.primary:hover:not(:disabled) { background: #1a5fd0; }
  button:disabled { opacity: 0.45; cursor: default; }
  label { display: flex; align-items: center; gap: 6px; color: #3d434e; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; font-size: 13px; }
  dt { color: #6b7280; }
  dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .ok { color: #18794e; } .bad { color: #b42318; } .warn { color: #a15c07; }
  #log {
    margin: 0; padding: 0; list-style: none; font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    max-height: 420px; overflow: auto;
  }
  #log li { padding: 3px 0; border-bottom: 1px dotted #eceef2; overflow-wrap: anywhere; }
  #log time { color: #98a0ad; margin-right: 6px; }
  code { font-size: 12.5px; background: #f1f3f6; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>Прототип: SQLite-Wasm + OPFS</h1>
  <p class="lead">
    Стенд проверяет три вещи: работает ли SQLite поверх OPFS, что происходит при двух вкладках
    на одну БД, и переживают ли данные перезагрузку. Модель данных повторяет
    <code>objects</code> из <code>src/services/localDbSvc.js</code>.
  </p>

  <div class="grid">
    <section>
      <h2>Среда</h2>
      <dl id="env"></dl>
    </section>

    <section>
      <h2>Соединение</h2>
      <div class="row">
        <label><input type="radio" name="mode" value="leader" checked> Лидер-вкладка (Web Locks + BroadcastChannel)</label>
        <label><input type="radio" name="mode" value="dedicated"> Dedicated (воркер на вкладку, VFS opfs)</label>
      </div>
      <div class="row">
        <button class="primary" id="connect">Подключиться</button>
        <button id="disconnect">Отключиться</button>
      </div>
      <dl id="dbinfo"></dl>
    </section>

    <section>
      <h2>Операции</h2>
      <div class="row">
        <button id="write">Записать 1000</button>
        <button id="read">Прочитать 1</button>
        <button id="scan">Scan с tx=0</button>
        <button id="count">Count</button>
      </div>
      <div class="row">
        <button id="persist">persist()</button>
        <button id="reopen">Второе соединение</button>
        <button id="clear">Очистить</button>
      </div>
      <dl id="lastop"></dl>
    </section>

    <section>
      <h2>Журнал</h2>
      <ul id="log"></ul>
    </section>
  </div>

<script type="module" src="./app.js"></script>
</body>
</html>
